name: my_pet_clinic

on:
  pull_request:
    branches:
      - main
        

jobs:
    pet_clinic:
        runs-on: ubuntu-latest
        steps:
            - name: check the build
              uses: actions/checkout@v4
            - name: build the code
              run: cd pet-clinic && mvn compile
            - name: check the test
              run: cd pet-clinic && mvn test
            - name: create the package
              run:  mvn package

